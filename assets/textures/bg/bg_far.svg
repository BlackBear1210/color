<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형 · v2] 원경 배경 (패럴랙스 0.2). 명도 규칙표: 원경 55~75%, 밝고 흐리게.
       v2: 세로 1000px 로 연장 — 바닥 아래까지 배경이 이어져 "빈 회색" 구간이 안 보이게. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2C2C2"/>
      <stop offset="0.55" stop-color="#A6A6A6"/>
      <stop offset="1" stop-color="#7E7E7E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- 아주 먼 스카이라인 (명도 ~66%) — 전부 바닥까지 내려오는 실루엣 -->
  <g fill="#A9A9A9">
    <rect x="40"  y="260" width="90"  height="740"/>
    <rect x="150" y="200" width="60"  height="800"/>
    <rect x="260" y="300" width="120" height="700"/>
    <rect x="430" y="170" width="70"  height="830"/>
    <rect x="540" y="280" width="100" height="720"/>
    <rect x="700" y="220" width="80"  height="780"/>
    <rect x="830" y="320" width="140" height="680"/>
    <rect x="1010" y="180" width="65" height="820"/>
    <rect x="1120" y="270" width="110" height="730"/>
    <rect x="1280" y="230" width="75" height="770"/>
    <rect x="1400" y="310" width="130" height="690"/>
  </g>
  <!-- 조금 가까운 스카이라인 (명도 ~58%) -->
  <g fill="#949494">
    <rect x="0"   y="380" width="140" height="620"/>
    <rect x="200" y="340" width="90"  height="660"/>
    <rect x="340" y="420" width="160" height="580"/>
    <rect x="560" y="360" width="80"  height="640"/>
    <rect x="690" y="410" width="130" height="590"/>
    <rect x="880" y="350" width="100" height="650"/>
    <rect x="1040" y="430" width="150" height="570"/>
    <rect x="1250" y="370" width="90" height="630"/>
    <rect x="1390" y="420" width="210" height="580"/>
    <!-- 지붕 몇 개 (계단식 픽셀) -->
    <rect x="216" y="324" width="58" height="16"/>
    <rect x="576" y="344" width="48" height="16"/>
  </g>
</svg>
