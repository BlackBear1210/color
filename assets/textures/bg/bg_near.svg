<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형] 근경 배경 (패럴랙스 0.8). 명도 규칙표: 근경 15~30%.
       전신주 + 늘어진 전선 + 철망 펜스 — 바인(Vine) 레퍼런스의 근경 소품 문법. -->
  <g fill="#333333">
    <!-- 전신주 1 -->
    <rect x="220" y="20" width="14" height="340"/>
    <rect x="150" y="44" width="150" height="8"/>
    <rect x="180" y="70" width="94" height="6"/>
    <!-- 전신주 2 -->
    <rect x="980" y="0" width="14" height="360"/>
    <rect x="910" y="26" width="150" height="8"/>
    <rect x="940" y="52" width="94" height="6"/>
    <!-- 부러진 가로등 -->
    <rect x="1500" y="60" width="10" height="300"/>
    <rect x="1470" y="60" width="40" height="8"/>
  </g>
  <!-- 늘어진 전선 (얇은 곡선) -->
  <g stroke="#2E2E2E" stroke-width="3" fill="none" shape-rendering="auto">
    <path d="M234 48 Q 600 130 917 30"/>
    <path d="M234 74 Q 620 170 947 56"/>
    <path d="M994 30 Q 1250 90 1474 64"/>
  </g>
  <!-- 철망 펜스 (하단) -->
  <g stroke="#383838" stroke-width="2" fill="none" shape-rendering="auto">
    <path d="M0 300 H1600 M0 352 H1600"/>
  </g>
  <g stroke="#383838" stroke-width="1.5" fill="none" shape-rendering="auto">
    <path d="M0 300 l52 52 M40 300 l52 52 M80 300 l52 52 M120 300 l52 52 M160 300 l52 52 M200 300 l52 52 M240 300 l52 52 M280 300 l52 52 M320 300 l52 52 M360 300 l52 52 M400 300 l52 52 M440 300 l52 52 M480 300 l52 52 M520 300 l52 52 M560 300 l52 52 M600 300 l52 52 M640 300 l52 52 M680 300 l52 52 M720 300 l52 52 M760 300 l52 52 M800 300 l52 52 M840 300 l52 52 M880 300 l52 52 M920 300 l52 52 M960 300 l52 52 M1000 300 l52 52 M1040 300 l52 52 M1080 300 l52 52 M1120 300 l52 52 M1160 300 l52 52 M1200 300 l52 52 M1240 300 l52 52 M1280 300 l52 52 M1320 300 l52 52 M1360 300 l52 52 M1400 300 l52 52 M1440 300 l52 52 M1480 300 l52 52 M1520 300 l52 52 M1560 300 l52 52"/>
    <path d="M52 300 l-52 52 M92 300 l-52 52 M132 300 l-52 52 M172 300 l-52 52 M212 300 l-52 52 M252 300 l-52 52 M292 300 l-52 52 M332 300 l-52 52 M372 300 l-52 52 M412 300 l-52 52 M452 300 l-52 52 M492 300 l-52 52 M532 300 l-52 52 M572 300 l-52 52 M612 300 l-52 52 M652 300 l-52 52 M692 300 l-52 52 M732 300 l-52 52 M772 300 l-52 52 M812 300 l-52 52 M852 300 l-52 52 M892 300 l-52 52 M932 300 l-52 52 M972 300 l-52 52 M1012 300 l-52 52 M1052 300 l-52 52 M1092 300 l-52 52 M1132 300 l-52 52 M1172 300 l-52 52 M1212 300 l-52 52 M1252 300 l-52 52 M1292 300 l-52 52 M1332 300 l-52 52 M1372 300 l-52 52 M1412 300 l-52 52 M1452 300 l-52 52 M1492 300 l-52 52 M1532 300 l-52 52 M1572 300 l-52 52"/>
  </g>
</svg>
