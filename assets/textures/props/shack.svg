<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- [2026-07-19 도형] 판잣집 실루엣 — zone3(도시) 하단 "판자촌" 배경 오브젝트.
       플레이어 뒤(z_index 음수)에 깔리는 중경 실루엣. 창문 하나만 밝게 —
       옆에 낮은 에너지 PointLight2D 를 얹으면 "빛이 새어나오는 창"이 된다. -->
  <!-- 몸체 -->
  <rect x="18" y="58" width="164" height="92" fill="#181818"/>
  <!-- 기울어진 함석 지붕 -->
  <path d="M6 66 L96 16 L196 60 L186 68 L96 28 L16 74 Z" fill="#0e0e0e"/>
  <!-- 판자 이음선 -->
  <g stroke="#232323" stroke-width="2">
    <line x1="18" y1="84" x2="182" y2="84"/>
    <line x1="18" y1="108" x2="182" y2="108"/>
    <line x1="18" y1="130" x2="182" y2="130"/>
    <line x1="66" y1="58" x2="66" y2="150"/>
    <line x1="132" y1="58" x2="132" y2="150"/>
  </g>
  <!-- 연통 -->
  <rect x="150" y="30" width="10" height="26" fill="#141414"/>
  <!-- 문(더 어두움) -->
  <rect x="84" y="102" width="26" height="48" fill="#0b0b0b"/>
  <!-- ★불 켜진 창 — 어두운 판자촌에 새어나오는 빛 -->
  <rect x="34" y="92" width="20" height="18" fill="#efe8c6"/>
  <rect x="34" y="92" width="20" height="18" fill="none" stroke="#0d0d0d" stroke-width="3"/>
  <line x1="44" y1="92" x2="44" y2="110" stroke="#0d0d0d" stroke-width="2"/>
</svg>
