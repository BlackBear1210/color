<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32">
  <!-- 예비(플레이스홀더) 지형 타일 4종. 32x32px. ART 타일 완성 시 같은 배치로 교체 -->
  <!-- (0,0) 흑 발판: 흑 상태 플레이어가 밟음 -->
  <rect x="0" y="0" width="32" height="32" fill="#000000"/>
  <path d="M6 26 L13 18 L19 23 L26 14" stroke="#141414" stroke-width="2" fill="none"/>
  <!-- (1,0) 백 발판: 백 상태 플레이어가 밟음 -->
  <rect x="32" y="0" width="32" height="32" fill="#FFFFFF"/>
  <rect x="33" y="1" width="30" height="30" fill="none" stroke="#E6E6E6" stroke-width="2"/>
  <path d="M38 26 L45 18 L51 23 L58 14" stroke="#E6E6E6" stroke-width="2" fill="none"/>
  <!-- (2,0) 회색 = 혼합된 죽은 지형: 아무도 못 밟음 -->
  <rect x="64" y="0" width="32" height="32" fill="#808080"/>
  <path d="M70 6 L90 26 M90 6 L70 26" stroke="#6B6B6B" stroke-width="3"/>
  <!-- (3,0) 무색 = 칠 가능 발판: 점선 테두리로 "칠할 수 있음" 표시 -->
  <rect x="96" y="0" width="32" height="32" fill="#BFBFBF"/>
  <rect x="98" y="2" width="28" height="28" fill="none" stroke="#4D4D4D" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
