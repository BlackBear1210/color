<svg xmlns="http://www.w3.org/2000/svg" width="192" height="32">
  <!-- [2026-07-14 도형] 예비(플레이스홀더) 지형 타일 6종. 32x32px. ART 타일 완성 시 같은 배치로 교체.
       4px 격자 도트(픽셀) 디테일 = 바인(Vine) 스타일 테스트: 실루엣은 플랫 유지, 내부만 저대비 2톤.
       (0,0) 흑 발판   (1,0) 백 발판   (2,0) 회색(죽은 지형)
       (3,0) 무색-1회  (4,0) 무색-2회  (5,0) 무색-3회  ← 점 개수 = 필요 명중 횟수 -->

  <!-- (0,0) 흑 발판: 명도 0~10%. 윗면에 저대비 도트 하이라이트(잔디/이끼 느낌) -->
  <rect x="0" y="0" width="32" height="32" fill="#0A0A0A"/>
  <rect x="0" y="0" width="4" height="4" fill="#1E1E1E"/><rect x="8" y="0" width="4" height="4" fill="#1E1E1E"/>
  <rect x="16" y="0" width="4" height="4" fill="#181818"/><rect x="24" y="0" width="4" height="4" fill="#1E1E1E"/>
  <rect x="4" y="4" width="4" height="4" fill="#141414"/><rect x="20" y="4" width="4" height="4" fill="#141414"/>
  <rect x="12" y="16" width="4" height="4" fill="#121212"/><rect x="24" y="24" width="4" height="4" fill="#121212"/>

  <!-- (1,0) 백 발판: 명도 90~100%. 같은 문법의 저대비 도트 -->
  <rect x="32" y="0" width="32" height="32" fill="#F7F7F7"/>
  <rect x="32" y="0" width="4" height="4" fill="#DDDDDD"/><rect x="40" y="0" width="4" height="4" fill="#DDDDDD"/>
  <rect x="48" y="0" width="4" height="4" fill="#E4E4E4"/><rect x="56" y="0" width="4" height="4" fill="#DDDDDD"/>
  <rect x="36" y="4" width="4" height="4" fill="#EBEBEB"/><rect x="52" y="4" width="4" height="4" fill="#EBEBEB"/>
  <rect x="44" y="16" width="4" height="4" fill="#EEEEEE"/><rect x="56" y="24" width="4" height="4" fill="#EEEEEE"/>

  <!-- (2,0) 회색 = 혼합된 죽은 지형: 명도 45~55% 전용 대역. X 무늬 = 아무도 못 밟음 -->
  <rect x="64" y="0" width="32" height="32" fill="#808080"/>
  <path d="M70 6 L90 26 M90 6 L70 26" stroke="#6B6B6B" stroke-width="3"/>

  <!-- (3,0) 무색-1회: 점선 테두리(칠 가능) + 점 1개 = 1발이면 칠해짐 -->
  <rect x="96" y="0" width="32" height="32" fill="#BFBFBF"/>
  <rect x="98" y="2" width="28" height="28" fill="none" stroke="#4D4D4D" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="110" y="22" width="4" height="4" fill="#4D4D4D"/>

  <!-- (4,0) 무색-2회: 점 2개 = 2발 필요 (내구도 표시) -->
  <rect x="128" y="0" width="32" height="32" fill="#B4B4B4"/>
  <rect x="130" y="2" width="28" height="28" fill="none" stroke="#4D4D4D" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="137" y="22" width="4" height="4" fill="#4D4D4D"/><rect x="144" y="22" width="4" height="4" fill="#4D4D4D"/>

  <!-- (5,0) 무색-3회: 점 3개 = 3발 필요 -->
  <rect x="160" y="0" width="32" height="32" fill="#A9A9A9"/>
  <rect x="162" y="2" width="28" height="28" fill="none" stroke="#4D4D4D" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="166" y="22" width="4" height="4" fill="#4D4D4D"/><rect x="173" y="22" width="4" height="4" fill="#4D4D4D"/><rect x="180" y="22" width="4" height="4" fill="#4D4D4D"/>
</svg>
