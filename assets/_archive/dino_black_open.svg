<svg xmlns="http://www.w3.org/2000/svg" width="20" height="16" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형] 공룡 캐릭터 (흑 상태, 입 벌림 — 발사 프레임).
       주둥이가 위/아래로 갈라지고 입 안(밝은 색)이 보인다. 총구(MOUTH_POS)가 이 입 위치와 일치. -->
  <!-- 외곽선 -->
  <g fill="#E8E8E8">
    <rect x="8" y="-1" width="13" height="6"/>   <!-- 윗주둥이 -->
    <rect x="8" y="3" width="7" height="6"/>     <!-- 머리 뒤쪽 -->
    <rect x="13" y="7" width="8" height="4"/>    <!-- 아래턱 -->
    <rect x="2" y="6" width="13" height="9"/>    <!-- 몸통 -->
    <rect x="-1" y="8" width="5" height="6"/>    <!-- 꼬리 -->
    <rect x="4" y="13" width="5" height="4"/>    <!-- 뒷다리 -->
    <rect x="9" y="13" width="5" height="4"/>    <!-- 앞다리 -->
  </g>
  <!-- 몸 -->
  <g fill="#262626">
    <rect x="9" y="0" width="11" height="4"/>    <!-- 윗주둥이 (들림) -->
    <rect x="9" y="4" width="5" height="3"/>     <!-- 머리 뒤쪽 -->
    <rect x="14" y="8" width="6" height="2"/>    <!-- 아래턱 (벌어짐) -->
    <rect x="3" y="7" width="11" height="7"/>    <!-- 몸통 -->
    <rect x="0" y="9" width="3" height="4"/>     <!-- 꼬리 -->
    <rect x="5" y="14" width="3" height="2"/>    <!-- 뒷다리 -->
    <rect x="10" y="14" width="3" height="2"/>   <!-- 앞다리 -->
  </g>
  <!-- 입 안 (벌어진 공간 — 밝은 색으로 뻥 뚫린 느낌) -->
  <rect x="14" y="4" width="6" height="4" fill="#E8E8E8"/>
  <!-- 배 / 눈 -->
  <rect x="4" y="10" width="6" height="3" fill="#333333"/>
  <rect x="14" y="1" width="2" height="2" fill="#E8E8E8"/>
</svg>
