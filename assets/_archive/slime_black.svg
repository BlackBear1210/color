<svg xmlns="http://www.w3.org/2000/svg" width="16" height="12" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형] 슬라임 캐릭터 (흑 상태). 16x12 도트, 단색 + 반전 외곽선.
       외곽선이 밝은 회백이라 검정 지형·어두운 배경 위에서도 실루엣이 살아있다.
       흰 상태는 slime_white.svg (색·외곽선 반전). 엔진에서 NEAREST 필터로 확대. -->
  <!-- 외곽선 (밝음) -->
  <rect x="4" y="0" width="8" height="1" fill="#EDEDED"/>
  <rect x="2" y="1" width="12" height="1" fill="#EDEDED"/>
  <rect x="1" y="2" width="14" height="1" fill="#EDEDED"/>
  <rect x="0" y="3" width="16" height="9" fill="#EDEDED"/>
  <!-- 몸통 (검정) -->
  <rect x="4" y="1" width="8" height="1" fill="#141414"/>
  <rect x="2" y="2" width="12" height="1" fill="#141414"/>
  <rect x="1" y="3" width="14" height="8" fill="#141414"/>
  <!-- 젤리 하이라이트 (저대비 1픽셀) -->
  <rect x="3" y="3" width="2" height="1" fill="#2B2B2B"/>
  <!-- 눈 (밝음) -->
  <rect x="4" y="5" width="2" height="2" fill="#EDEDED"/>
  <rect x="10" y="5" width="2" height="2" fill="#EDEDED"/>
  <!-- 입 (페인트를 뱉는 곳 — proto_gun 총구 위치와 대응) -->
  <rect x="7" y="8" width="2" height="1" fill="#EDEDED"/>
</svg>
