<svg xmlns="http://www.w3.org/2000/svg" width="16" height="12" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형] 슬라임 캐릭터 (백 상태). slime_black.svg 의 색·외곽선 반전판.
       외곽선이 어두워 흰 지형·밝은 배경 위에서도 실루엣이 살아있다. -->
  <!-- 외곽선 (어두움) -->
  <rect x="4" y="0" width="8" height="1" fill="#141414"/>
  <rect x="2" y="1" width="12" height="1" fill="#141414"/>
  <rect x="1" y="2" width="14" height="1" fill="#141414"/>
  <rect x="0" y="3" width="16" height="9" fill="#141414"/>
  <!-- 몸통 (흰색) -->
  <rect x="4" y="1" width="8" height="1" fill="#F2F2F2"/>
  <rect x="2" y="2" width="12" height="1" fill="#F2F2F2"/>
  <rect x="1" y="3" width="14" height="8" fill="#F2F2F2"/>
  <!-- 젤리 하이라이트 (저대비 1픽셀) -->
  <rect x="3" y="3" width="2" height="1" fill="#FFFFFF"/>
  <!-- 눈 (어두움) -->
  <rect x="4" y="5" width="2" height="2" fill="#141414"/>
  <rect x="10" y="5" width="2" height="2" fill="#141414"/>
  <!-- 입 -->
  <rect x="7" y="8" width="2" height="1" fill="#141414"/>
</svg>
