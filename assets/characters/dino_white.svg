<svg xmlns="http://www.w3.org/2000/svg" width="20" height="16" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형] 공룡 캐릭터 (백 상태, 입 닫힘). dino_black.svg 의 색 반전판.
       몸통(#EAEAEA)은 백 지형(#F7F7F7)보다 살짝 어둡게, 외곽선은 진한 색 = 밝은 배경에서도 실루엣 유지. -->
  <!-- 외곽선 -->
  <g fill="#171717">
    <rect x="8" y="-1" width="13" height="9"/>
    <rect x="2" y="6" width="13" height="9"/>
    <rect x="-1" y="8" width="5" height="6"/>
    <rect x="4" y="13" width="5" height="4"/>
    <rect x="9" y="13" width="5" height="4"/>
  </g>
  <!-- 몸 (지형 백보다 어두운 톤) -->
  <g fill="#EAEAEA">
    <rect x="9" y="0" width="11" height="7"/>
    <rect x="3" y="7" width="11" height="7"/>
    <rect x="0" y="9" width="3" height="4"/>
    <rect x="5" y="14" width="3" height="2"/>
    <rect x="10" y="14" width="3" height="2"/>
  </g>
  <!-- 배 (저대비 셰이드) -->
  <rect x="4" y="10" width="6" height="3" fill="#DCDCDC"/>
  <!-- 눈 / 콧구멍 / 닫힌 입 -->
  <rect x="14" y="2" width="2" height="2" fill="#171717"/>
  <rect x="18" y="1" width="1" height="1" fill="#171717"/>
  <rect x="14" y="5" width="6" height="1" fill="#171717"/>
</svg>
