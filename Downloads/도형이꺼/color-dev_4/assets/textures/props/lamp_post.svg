<svg xmlns="http://www.w3.org/2000/svg" width="56" height="180" viewBox="0 0 56 180">
  <!-- [2026-07-19 도형] 가로등 — 복도/도시 구역의 광원 오브젝트.
       램프 헤드(밝은 원)가 노멀맵 명도 기준점이 되고, 실제 빛은 씬에 PointLight2D 로 얹는다. -->
  <!-- 받침 -->
  <rect x="18" y="170" width="20" height="8" rx="2" fill="#1b1b1b"/>
  <rect x="22" y="164" width="12" height="8" rx="2" fill="#222222"/>
  <!-- 기둥 -->
  <rect x="25" y="34" width="6" height="132" rx="2" fill="#262626"/>
  <rect x="26" y="34" width="2" height="132" fill="#3a3a3a"/>
  <!-- 팔(곡선) -->
  <path d="M28 36 C28 22 40 20 44 24" fill="none" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <!-- 램프 하우징 -->
  <path d="M36 22 L52 22 L49 34 L39 34 Z" fill="#1a1a1a"/>
  <!-- 전구(밝음) + 번짐 -->
  <ellipse cx="44" cy="33" rx="9" ry="6" fill="#f2f2ee" opacity="0.28"/>
  <circle cx="44" cy="31" r="4.5" fill="#f6f4ea"/>
  <!-- 기둥 장식 링 -->
  <rect x="23" y="120" width="10" height="4" rx="1.5" fill="#303030"/>
</svg>
