<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>챕터1 단순 구조도</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f3f5f8;color:#191d24;font-family:Malgun Gothic,sans-serif}header{max-width:1500px;margin:auto auto 26px}h1{font-size:30px}p{color:#637080;line-height:1.7}.grid{max-width:1700px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;cursor:pointer;text-align:left;color:inherit}.card h2{font-size:20px;margin:0 0 14px}.card img{width:100%;height:340px;object-fit:contain}.card span{color:#2673cf;font-size:15px}dialog{border:0;border-radius:12px;width:96vw;height:94vh;padding:16px;background:#fff}dialog::backdrop{background:#000a}.bar{display:flex;align-items:center;gap:18px;position:sticky;top:0;background:white;padding:10px;z-index:2}.bar button{padding:9px 16px;border:1px solid #ccd4de;border-radius:7px;background:white;cursor:pointer}.bar a{color:#2673cf}.view{overflow:auto;height:calc(100% - 65px)}#full{display:block;max-width:100%;height:auto;margin:auto}#full.actual{max-width:none}</style><header><h1>챕터1 · 단순 구조도 19장</h1><p>흑백 지형과 장애물, 시작(파란 동그라미)·도착(파란 사각형)을 표시했습니다. 플레이어 진행 방향은 표시하지 않았습니다.<br>카드를 누르면 크게 볼 수 있습니다. 긴 세로 스테이지는 ‘원본 크기’로 확대해서 보세요.<br>초기 상태의 설명용 구조도이며, 실제 게임 화면은 아닙니다.</p></header><main class="grid"><button class="card" data-src="챕터1-01_시작방.png"><h2>1-1 · 시작방</h2><img src="미리보기_01.png" alt="시작방"><span>크게 보기</span></button><button class="card" data-src="챕터1-02_달빛 복도.png"><h2>1-2 · 달빛 복도</h2><img src="미리보기_02.png" alt="달빛 복도"><span>크게 보기</span></button><button class="card" data-src="챕터1-03_서재.png"><h2>1-3 · 서재</h2><img src="미리보기_03.png" alt="서재"><span>크게 보기</span></button><button class="card" data-src="챕터1-04_긴 복도.png"><h2>1-4 · 긴 복도</h2><img src="미리보기_04.png" alt="긴 복도"><span>크게 보기</span></button><button class="card" data-src="챕터1-05_침실.png"><h2>1-5 · 침실</h2><img src="미리보기_05.png" alt="침실"><span>크게 보기</span></button><button class="card" data-src="챕터1-06_유령 복도.png"><h2>1-6 · 유령 복도</h2><img src="미리보기_06.png" alt="유령 복도"><span>크게 보기</span></button><button class="card" data-src="챕터1-07_수납실.png"><h2>1-7 · 수납실</h2><img src="미리보기_07.png" alt="수납실"><span>크게 보기</span></button><button class="card" data-src="챕터1-08_무너진 마루.png"><h2>1-8 · 무너진 마루</h2><img src="미리보기_08.png" alt="무너진 마루"><span>크게 보기</span></button><button class="card" data-src="챕터1-09_중앙 계단.png"><h2>1-9 · 중앙 계단</h2><img src="미리보기_09.png" alt="중앙 계단"><span>크게 보기</span></button><button class="card" data-src="챕터1-10_현관.png"><h2>1-10 · 현관</h2><img src="미리보기_10.png" alt="현관"><span>크게 보기</span></button><button class="card" data-src="챕터1-11_거실.png"><h2>1-11 · 거실</h2><img src="미리보기_11.png" alt="거실"><span>크게 보기</span></button><button class="card" data-src="챕터1-12_식당.png"><h2>1-12 · 식당</h2><img src="미리보기_12.png" alt="식당"><span>크게 보기</span></button><button class="card" data-src="챕터1-13_그을린 복도.png"><h2>1-13 · 그을린 복도</h2><img src="미리보기_13.png" alt="그을린 복도"><span>크게 보기</span></button><button class="card" data-src="챕터1-14_굴뚝.png"><h2>1-14 · 굴뚝</h2><img src="미리보기_14.png" alt="굴뚝"><span>크게 보기</span></button><button class="card" data-src="챕터1-15_뒷마당.png"><h2>1-15 · 뒷마당</h2><img src="미리보기_15.png" alt="뒷마당"><span>크게 보기</span></button><button class="card" data-src="챕터1-16_썩은 마루.png"><h2>1-16 · 썩은 마루</h2><img src="미리보기_16.png" alt="썩은 마루"><span>크게 보기</span></button><button class="card" data-src="챕터1-17_응접실.png"><h2>1-17 · 응접실</h2><img src="미리보기_17.png" alt="응접실"><span>크게 보기</span></button><button class="card" data-src="챕터1-18_숨은 서재.png"><h2>1-18 · 숨은 서재</h2><img src="미리보기_18.png" alt="숨은 서재"><span>크게 보기</span></button><button class="card" data-src="챕터1-19_거미방.png"><h2>1-19 · 거미방</h2><img src="미리보기_19.png" alt="거미방"><span>크게 보기</span></button></main><dialog id="modal"><div class="bar"><button id="close">닫기</button><button id="zoom">원본 크기 / 화면 맞춤</button><a id="download" download>PNG 저장</a><span id="name"></span></div><div class="view"><img id="full" alt="스테이지 구조도"></div></dialog><script>const modal=document.getElementById('modal'),full=document.getElementById('full');document.querySelectorAll('.card').forEach(card=>card.onclick=()=>{full.src=card.dataset.src;full.className='';document.getElementById('download').href=card.dataset.src;document.getElementById('name').textContent=card.querySelector('h2').textContent;modal.showModal()});document.getElementById('close').onclick=()=>modal.close();document.getElementById('zoom').onclick=()=>full.classList.toggle('actual');</script></html>
