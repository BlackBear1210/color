<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>챕터2 단순 구조도</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f3f5f8;color:#191d24;font-family:Malgun Gothic,sans-serif}header{max-width:1500px;margin:auto auto 26px}h1{font-size:30px}p{color:#637080;line-height:1.7}.grid{max-width:1700px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;cursor:pointer;text-align:left;color:inherit}.card h2{font-size:20px;margin:0 0 14px}.card img{width:100%;height:340px;object-fit:contain}.card span{color:#2673cf;font-size:15px}dialog{border:0;border-radius:12px;width:96vw;height:94vh;padding:16px;background:#fff}dialog::backdrop{background:#000a}.bar{display:flex;align-items:center;gap:18px;position:sticky;top:0;background:white;padding:10px;z-index:2}.bar button{padding:9px 16px;border:1px solid #ccd4de;border-radius:7px;background:white;cursor:pointer}.bar a{color:#2673cf}.view{overflow:auto;height:calc(100% - 65px)}#full{display:block;max-width:100%;height:auto;margin:auto}#full.actual{max-width:none}</style><header><h1>챕터2 · 2-1부터 2-8 구조도</h1><p>흑백 지형과 장애물, 시작(파란 동그라미)·도착(파란 사각형)을 표시했습니다. 플레이어 진행 방향은 표시하지 않았습니다.<br>카드를 누르면 크게 볼 수 있습니다. 긴 세로 스테이지는 ‘원본 크기’로 확대해서 보세요.<br>물·격자·밸브·호퍼·톱과 몬스터도 표시했습니다. 설명용 구조도이며, 실제 게임 화면은 아닙니다.</p></header><main class="grid"><button class="card" data-src="챕터2-01_물이 흐르는 곳.png"><h2>2-1 · 물이 흐르는 곳</h2><img src="미리보기_01.png" alt="물이 흐르는 곳"><span>크게 보기</span></button><button class="card" data-src="챕터2-02_번갈아 흐르는 물.png"><h2>2-2 · 번갈아 흐르는 물</h2><img src="미리보기_02.png" alt="번갈아 흐르는 물"><span>크게 보기</span></button><button class="card" data-src="챕터2-03_관을 따라서.png"><h2>2-3 · 관을 따라서</h2><img src="미리보기_03.png" alt="관을 따라서"><span>크게 보기</span></button><button class="card" data-src="챕터2-04_물탱크를 채워라.png"><h2>2-4 · 물탱크를 채워라</h2><img src="미리보기_04.png" alt="물탱크를 채워라"><span>크게 보기</span></button><button class="card" data-src="챕터2-05_계단을 꺼내라.png"><h2>2-5 · 계단을 꺼내라</h2><img src="미리보기_05.png" alt="계단을 꺼내라"><span>크게 보기</span></button><button class="card" data-src="챕터2-06_번갈아 쏟아지는 수갱.png"><h2>2-6 · 번갈아 쏟아지는 수갱</h2><img src="미리보기_06.png" alt="번갈아 쏟아지는 수갱"><span>크게 보기</span></button><button class="card" data-src="챕터2-07_두 조각 열쇠.png"><h2>2-7 · 두 조각 열쇠</h2><img src="미리보기_07.png" alt="두 조각 열쇠"><span>크게 보기</span></button><button class="card" data-src="챕터2-08_두 갈래 탑.png"><h2>2-8 · 두 갈래 탑</h2><img src="미리보기_08.png" alt="두 갈래 탑"><span>크게 보기</span></button></main><dialog id="modal"><div class="bar"><button id="close">닫기</button><button id="zoom">원본 크기 / 화면 맞춤</button><a id="download" download>PNG 저장</a><span id="name"></span></div><div class="view"><img id="full" alt="스테이지 구조도"></div></dialog><script>const modal=document.getElementById('modal'),full=document.getElementById('full');document.querySelectorAll('.card').forEach(card=>card.onclick=()=>{full.src=card.dataset.src;full.className='';document.getElementById('download').href=card.dataset.src;document.getElementById('name').textContent=card.querySelector('h2').textContent;modal.showModal()});document.getElementById('close').onclick=()=>modal.close();document.getElementById('zoom').onclick=()=>full.classList.toggle('actual');</script></html>
