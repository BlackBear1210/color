<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형 · v2] 중경 배경 (패럴랙스 0.5). 명도 30~42%만 사용 (45~55%는 회색 지형 전용 대역).
       v2: 세로 1000px 로 연장 — 건물 실루엣이 바닥 아래까지 이어짐. 광원 왼쪽 위 통일. -->
  <!-- 폐건물 실루엣 (명도 ~37%) -->
  <g fill="#5E5E5E">
    <rect x="80"  y="300" width="160" height="700"/>
    <rect x="360" y="220" width="110" height="780"/>
    <rect x="620" y="340" width="200" height="660"/>
    <rect x="900" y="260" width="130" height="740"/>
    <rect x="1150" y="320" width="170" height="680"/>
    <rect x="1420" y="240" width="120" height="760"/>
    <!-- 무너진 지붕 픽셀 계단 -->
    <rect x="360" y="204" width="56" height="16"/>
    <rect x="900" y="244" width="72" height="16"/>
    <rect x="1420" y="224" width="48" height="16"/>
  </g>
  <g fill="#6B6B6B">
    <!-- 광원(좌상) 받는 왼쪽 면 -->
    <rect x="80"  y="300" width="16" height="700"/>
    <rect x="360" y="220" width="16" height="780"/>
    <rect x="620" y="340" width="16" height="660"/>
    <rect x="900" y="260" width="16" height="740"/>
    <rect x="1150" y="320" width="16" height="680"/>
    <rect x="1420" y="240" width="16" height="760"/>
  </g>
  <!-- 깨진 창문 (어두운 픽셀 구멍, 명도 ~30%) -->
  <g fill="#4D4D4D">
    <rect x="120" y="340" width="12" height="16"/><rect x="160" y="340" width="12" height="16"/>
    <rect x="120" y="390" width="12" height="16"/><rect x="196" y="390" width="12" height="16"/>
    <rect x="392" y="260" width="12" height="16"/><rect x="428" y="300" width="12" height="16"/>
    <rect x="392" y="350" width="12" height="16"/>
    <rect x="672" y="380" width="12" height="16"/><rect x="732" y="380" width="12" height="16"/>
    <rect x="932" y="300" width="12" height="16"/><rect x="968" y="350" width="12" height="16"/>
    <rect x="1190" y="360" width="12" height="16"/><rect x="1250" y="410" width="12" height="16"/>
    <rect x="1452" y="280" width="12" height="16"/><rect x="1488" y="330" width="12" height="16"/>
  </g>
</svg>
