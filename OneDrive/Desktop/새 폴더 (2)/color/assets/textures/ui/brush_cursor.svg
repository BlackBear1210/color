<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28">
  <!-- [2026-07-14 도형] 붓 마우스 커서. 붓끝(핫스팟) = 좌하단 (3, 25) 부근.
       색칠 게임 정체성 표현용 — 게임 중 기본 커서를 이 붓으로 교체한다. -->
  <!-- 붓끝 (밝은 회백 — 어두운 배경에서도 보이도록) -->
  <path d="M3 25 L6 18 L10 22 Z" fill="#E8E8E8" stroke="#1A1A1A" stroke-width="1"/>
  <!-- 페룰(금속 고리) -->
  <rect x="7.5" y="14.5" width="7" height="5" rx="1" transform="rotate(45 11 17)" fill="#9A9A9A" stroke="#1A1A1A" stroke-width="1"/>
  <!-- 손잡이 (대각선) -->
  <rect x="12" y="4" width="5" height="14" rx="2" transform="rotate(45 14.5 11)" fill="#3C3C3C" stroke="#111111" stroke-width="1"/>
  <!-- 붓끝에 맺힌 물감 방울 -->
  <circle cx="4" cy="26" r="1.8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.8"/>
</svg>
