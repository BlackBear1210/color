<svg xmlns="http://www.w3.org/2000/svg" width="20" height="16" shape-rendering="crispEdges">
  <!-- [2026-07-14 도형] 공룡 캐릭터 (흑 상태, 입 닫힘). 20x16 도트, arks dino-characters 스타일 오마주.
       몸통(#262626)은 흑 지형(#0A0A0A)보다 살짝 밝게, 외곽선은 밝은 회백 = 어떤 배경에서도 실루엣 유지.
       발사 순간에는 dino_black_open.svg 로 스왑 (입 벌리고 페인트 발사). 오른쪽을 보는 기본 방향. -->
  <!-- 외곽선 (몸 각 덩어리를 1px씩 키워서 그림) -->
  <g fill="#E8E8E8">
    <rect x="8" y="-1" width="13" height="9"/>   <!-- 머리 -->
    <rect x="2" y="6" width="13" height="9"/>    <!-- 몸통 -->
    <rect x="-1" y="8" width="5" height="6"/>    <!-- 꼬리 -->
    <rect x="4" y="13" width="5" height="4"/>    <!-- 뒷다리 -->
    <rect x="9" y="13" width="5" height="4"/>    <!-- 앞다리 -->
  </g>
  <!-- 몸 (지형 흑보다 밝은 톤) -->
  <g fill="#262626">
    <rect x="9" y="0" width="11" height="7"/>    <!-- 머리 -->
    <rect x="3" y="7" width="11" height="7"/>    <!-- 몸통 -->
    <rect x="0" y="9" width="3" height="4"/>     <!-- 꼬리 -->
    <rect x="5" y="14" width="3" height="2"/>    <!-- 뒷다리 -->
    <rect x="10" y="14" width="3" height="2"/>   <!-- 앞다리 -->
  </g>
  <!-- 배 (저대비 셰이드 — 지형과 다른 명암) -->
  <rect x="4" y="10" width="6" height="3" fill="#333333"/>
  <!-- 눈 / 콧구멍 / 닫힌 입 (전부 밝은 색 = 대비) -->
  <rect x="14" y="2" width="2" height="2" fill="#E8E8E8"/>
  <rect x="18" y="1" width="1" height="1" fill="#E8E8E8"/>
  <rect x="14" y="5" width="6" height="1" fill="#E8E8E8"/>
</svg>
